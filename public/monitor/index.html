<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导播</title>
  <script src="/livekit-client.umd.min.js"></script>
  <script src="/sweetalert.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }

    #video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    #participant-name-overlay {
      position: absolute;
      bottom: 20px;
      left: 50px;
      z-index: 2;
      font-size: 55px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.95);
      background-color: rgba(0, 0, 0, 0.55);
      padding: 8px 18px;
      border-radius: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      display: none;
      pointer-events: none;
      letter-spacing: 1px;
    }

    .overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 999;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      gap: 10px;
      align-items: center;
      max-width: 90vw;
      flex-wrap: wrap;
      opacity: 0.3;
      transition: opacity 0.2s;
    }
    .overlay:hover { opacity: 1; }

    input, button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 10px;
      border-radius: 4px;
      outline: none;
      font-size: 13px;
    }

    .btn-primary {
      background: #2563eb;
      cursor: pointer;
      border: none;
      font-weight: bold;
    }
    .btn-primary:hover { background: #1d4ed8; }

    .tab-group {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #aaa;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #3b82f6;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.5);
    }

    #status { font-size: 12px; color: #aaa; }
  </style>
</head>
<body>

  <div id="video-container">
    <video id="main-video" autoplay playsinline muted></video>
    <div id="participant-name-overlay"></div>
  </div>

  <div class="overlay">
    <input type="text" id="token-input" placeholder="贴入 Token..." style="width: 200px;">
    <button id="connect-btn" class="btn-primary">进房</button>
    
    <div id="participant-tabs" class="tab-group"></div>
    
    <button id="fullscreen-btn">全屏</button>
    <button id="reset-token-btn" style="display:none; background:#dc2626; border:none;">更换 Token</button>
    <span id="status">未连接</span>
  </div>

  <script>
    const { Room, RoomEvent, VideoQuality, Track } = LivekitClient;

    const SERVER_URL = 'wss://live.yee.autos:7880';
    const TOKEN_KEY = 'livekit_director_token';
    let room = null;
    let currentIdentity = null;

    const videoEl = document.getElementById('main-video');
    const nameOverlayEl = document.getElementById('participant-name-overlay');
    const tokenInput = document.getElementById('token-input');
    const connectBtn = document.getElementById('connect-btn');
    const participantTabs = document.getElementById('participant-tabs');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const resetTokenBtn = document.getElementById('reset-token-btn');
    const statusEl = document.getElementById('status');

    // 页面加载完成后处理自动连接
    window.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem(TOKEN_KEY);
      if (savedToken) {
        tokenInput.value = savedToken;
        // 自动触发连接
        doConnect(savedToken);
      }
    });

    // 按钮手动点击连接
    connectBtn.addEventListener('click', () => {
      const token = tokenInput.value.trim();
      if (!token) return swal('错误','Token 不能为空','error');
      doConnect(token);
    });

    // 核心连接逻辑
    async function doConnect(token) {
      statusEl.innerText = '连接中...';
      connectBtn.disabled = true;

      try {
        if (room) room.disconnect();

        room = new Room({
          adaptiveStream: false,
          dynacast: false,
        });

        // 事件监听
        room.on(RoomEvent.ParticipantConnected, refreshParticipants);
        
        room.on(RoomEvent.ParticipantDisconnected, (p) => {
          refreshParticipants();
          // 如果退场的是当前观看的选手，自动寻找下一个可用画面
          if (p.identity === currentIdentity) {
            currentIdentity = null;
            videoEl.srcObject = null;
            nameOverlayEl.style.display = 'none';
            autoSelectFirstAvailable();
          }
        });

        // 监听到新画面的订阅
        room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
          if (track.kind === Track.Kind.Video) {
            // 情况1：当前没有选中任何人，或者选中的人一直没画面，监听到有新视频流直接切过去
            if (!currentIdentity) {
              switchParticipant(participant.identity);
            } 
            // 情况2：刚好是当前选中的选手发了画面
            else if (participant.identity === currentIdentity) {
              publication.setVideoQuality(VideoQuality.HIGH);
              track.attach(videoEl);
              updateNameOverlay(participant);
            }
          }
        });

        await room.connect(SERVER_URL, token);
        localStorage.setItem(TOKEN_KEY, token);

        statusEl.innerText = '在线';
        tokenInput.style.display = 'none';
        connectBtn.style.display = 'none';
        resetTokenBtn.style.display = 'inline-block';
        participantTabs.style.display = 'flex';

        refreshParticipants();

        // 连入房间后，如果已经有人在推流，自动切到第一个
        autoSelectFirstAvailable();

      } catch (err) {
        console.error(err);
        statusEl.innerText = '连接失败';
        // 如果是自动进房失败（可能是 Token 过期或无效），恢复输入界面并清空错误 Token
        tokenInput.style.display = 'inline-block';
        connectBtn.style.display = 'inline-block';
        resetTokenBtn.style.display = 'none';
        connectBtn.disabled = false;
      }
    }

    // 自动寻找并切换到第一个有视频画面的选手
    function autoSelectFirstAvailable() {
      if (!room) return;
      const participants = Array.from(room.remoteParticipants.values());
      
      for (const p of participants) {
        // 查找是否有视频 publication
        const videoPub = Array.from(p.videoTrackPublications.values())[0];
        if (videoPub) {
          switchParticipant(p.identity);
          break;
        }
      }
    }

    // 渲染 Tab 列表
    function refreshParticipants() {
      if (!room) return;
      const participants = Array.from(room.remoteParticipants.values());

      participantTabs.innerHTML = '';

      if (participants.length === 0) {
        participantTabs.innerHTML = '<span style="font-size:12px;color:#888;">暂无选手推流</span>';
        return;
      }

      participants.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (p.identity === currentIdentity ? ' active' : '');
        btn.innerText = p.name || p.identity;
        btn.onclick = () => switchParticipant(p.identity);
        participantTabs.appendChild(btn);
      });
    }

    function updateNameOverlay(participant) {
      if (participant) {
        nameOverlayEl.innerText = participant.name || participant.identity;
        nameOverlayEl.style.display = 'block';
      } else {
        nameOverlayEl.style.display = 'none';
      }
    }

    // 切换选手画面
    function switchParticipant(identity) {
      if (currentIdentity === identity && videoEl.srcObject) return;
      currentIdentity = identity;

      videoEl.srcObject = null;
      nameOverlayEl.style.display = 'none';
      refreshParticipants();

      if (!identity) return;

      const participant = room.remoteParticipants.get(identity);
      if (!participant) return;

      updateNameOverlay(participant);

      const videoPub = Array.from(participant.videoTrackPublications.values())[0];
      if (videoPub) {
        videoPub.setVideoQuality(VideoQuality.HIGH);
        if (videoPub.track) {
          videoPub.track.attach(videoEl);
        }
      }
    }

    // 更换 Token 按钮逻辑
    resetTokenBtn.addEventListener('click', () => {
      localStorage.removeItem(TOKEN_KEY);
      if (room) room.disconnect();
      location.reload();
    });

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
